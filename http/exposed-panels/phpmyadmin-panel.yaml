id: phpmyadmin-panel

info:
  name: phpMyAdmin Panel - Detect
  author: pdteam,righettod,snidova
  severity: info
  description: phpMyAdmin panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:phpmyadmin:phpmyadmin:*:*:*:*:*:*:*:*
  metadata:
    max-request: 20
    verified: true
    vendor: phpmyadmin
    product: phpmyadmin
    shodan-query:
      - "http.title:phpMyAdmin"
      - http.title:"phpmyadmin"
      - http.component:"phpmyadmin"
    fofa-query:
      - title="phpmyadmin"
    google-query: intitle:"phpmyadmin"
  tags: panel,phpmyadmin,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/phpmyadmin/"
      - "{{BaseURL}}/phpMyAdmin/"
      - "{{BaseURL}}/admin/phpmyadmin/"
      - "{{BaseURL}}/_phpmyadmin/"
      - "{{BaseURL}}/administrator/phpmyadmin/"
      - "{{BaseURL}}/phpma/"
      - "{{BaseURL}}/pma/"
      - "{{BaseURL}}/dbadmin/"
      - "{{BaseURL}}/phpMyAdmin/index.php"
    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: word
        words:
          - 'alt="phpMyAdmin'
          - 'name="pma_username'
          - '/pmahomme/'
          - 'pma_servername'
          - 'phpMyAdmin'
          - 'PMA'
        condition: or
      - type: word
        words:
          - "phpMyAdmin"
        part: header

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'v=([0-9a-z.-]+)'